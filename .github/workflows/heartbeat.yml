# GitHub disables a repository's scheduled workflows after 60 days with no
# activity, and does it silently - the first sign is that the videos stopped
# appearing. This commits a timestamp once a week so the clock never gets there.
#
# It is deliberately the smallest job that counts as activity.
name: Heartbeat

on:
  schedule:
    - cron: '17 3 * * 1'      # Mondays, off the hour so it does not queue behind everything else
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heartbeat
  cancel-in-progress: true

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Touch the heartbeat file
        run: |
          mkdir -p .github
          date -u '+%Y-%m-%d %H:%M UTC' > .github/heartbeat.txt
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/heartbeat.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: keep scheduled workflows alive'
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo 'push lost a race, next week will do'
