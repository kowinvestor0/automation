name: Auto Make Money CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify core modules
        run: |
          python -m py_compile app.py
          python -m py_compile ui/server.py
          python -m py_compile core/scheduler.py
          python -m py_compile core/video_engine.py
          python -m py_compile core/video_commentary.py
          python -m py_compile core/trending_news.py
          python -c "print('All Auto Make Money core modules verified successfully!')"
