# The background worker. High-throughput 2-stage parallel architecture:
# Stage 1 (render): 4 parallel worker shards render videos concurrently with FFmpeg turbo.
# Stage 2 (publish): Centralized coordinator downloads all batches, publishes across
# all configured Planly accounts, books slots without race conditions, and commits STATUS.md.
name: Generate videos

on:
  schedule:
    # Every 3 hours: 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC
    # (07:00, 10:00, 13:00, 16:00, 19:00, 22:00, 01:00, 04:00 Vietnam time UTC+7)
    # 8 runs/day * 24 videos = 192 videos/day (scalable to 288+)
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Videos per worker shard (default 6)'
        default: '6'
      niche:
        description: 'Force a niche (optional)'
        default: ''
      live:
        description: 'Really post to Planly (off = dry run)'
        type: boolean
        default: true

concurrency:
  group: generate-videos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # STAGE 1: Parallel Video Rendering (4 Concurrent Matrix Workers)
  # ---------------------------------------------------------------------------
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - factory: us
            shard: 1
          - factory: us
            shard: 2
          - factory: us
            shard: 3
          - factory: us
            shard: 4

    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Restore media cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cache/viral_sources
            factories/${{ matrix.factory }}/cache
          key: media-cache-${{ matrix.factory }}-${{ github.run_id }}
          restore-keys: |
            media-cache-${{ matrix.factory }}-

      - name: Render videos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IN_COUNT: ${{ inputs.count || '6' }}
          IN_NICHE: ${{ inputs.niche || '' }}
        run: |
          args=(--factory "${{ matrix.factory }}" --no-publish)
          [ -n "$IN_COUNT" ] && args+=(--count "$IN_COUNT")
          [ -n "$IN_NICHE" ] && args+=(--niche "$IN_NICHE")
          echo "=== Starting Worker Shard: ${{ matrix.factory }} #${{ matrix.shard }} (${args[*]}) ==="
          python tools/run_factory.py "${args[@]}"

      - name: Upload worker output
        uses: actions/upload-artifact@v4
        with:
          name: batch-${{ matrix.factory }}-${{ matrix.shard }}
          path: |
            factories/${{ matrix.factory }}/output/**/video.mp4
            factories/${{ matrix.factory }}/output/**/meta.json
            factories/${{ matrix.factory }}/output/**/script.json
            factories/${{ matrix.factory }}/output/**/credits.txt
            factories/${{ matrix.factory }}/output/**/creditos.txt
          retention-days: 14

  # ---------------------------------------------------------------------------
  # STAGE 2: Centralized Publish Coordinator & Multi-Account Scheduler
  # ---------------------------------------------------------------------------
  publish:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            factories/us/state.json
            factories/mx/state.json
          key: hub-state-${{ github.run_id }}
          restore-keys: |
            hub-state-

      - name: Download all worker batches
        uses: actions/download-artifact@v4
        with:
          pattern: batch-*
          path: downloaded_batches

      - name: Merge downloaded batches into factory output
        run: |
          python -c "
          from pathlib import Path
          import shutil

          dl = Path('downloaded_batches')
          count = 0
          if dl.exists():
              for meta_path in sorted(dl.rglob('meta.json')):
                  folder = meta_path.parent
                  factory = 'mx' if ('mx' in str(meta_path).lower()) else 'us'
                  dest = Path('factories') / factory / 'output' / folder.name
                  dest.mkdir(parents=True, exist_ok=True)
                  for item in folder.iterdir():
                      if item.is_file():
                          shutil.copy2(item, dest / item.name)
                  count += 1
          print(f'Merged {count} video batch folder(s) into factory outputs.')
          "

      - name: Publish all videos to Planly & Update schedule
        env:
          PLANLY_API_KEY: ${{ secrets.PLANLY_API_KEY }}
          PLANLY_TEAM_ID: ${{ secrets.PLANLY_TEAM_ID }}
          PLANLY_API_KEY_2: ${{ secrets.PLANLY_API_KEY_2 }}
          PLANLY_TEAM_ID_2: ${{ secrets.PLANLY_TEAM_ID_2 }}
          PLANLY_API_KEY_3: ${{ secrets.PLANLY_API_KEY_3 }}
          PLANLY_TEAM_ID_3: ${{ secrets.PLANLY_TEAM_ID_3 }}
          PLANLY_API_KEY_4: ${{ secrets.PLANLY_API_KEY_4 }}
          PLANLY_TEAM_ID_4: ${{ secrets.PLANLY_TEAM_ID_4 }}
          PLANLY_API_KEY_5: ${{ secrets.PLANLY_API_KEY_5 }}
          PLANLY_TEAM_ID_5: ${{ secrets.PLANLY_TEAM_ID_5 }}
          PLANLY_API_KEY_6: ${{ secrets.PLANLY_API_KEY_6 }}
          PLANLY_TEAM_ID_6: ${{ secrets.PLANLY_TEAM_ID_6 }}
          PLANLY_API_KEY_7: ${{ secrets.PLANLY_API_KEY_7 }}
          PLANLY_TEAM_ID_7: ${{ secrets.PLANLY_TEAM_ID_7 }}
          PLANLY_API_KEY_8: ${{ secrets.PLANLY_API_KEY_8 }}
          PLANLY_TEAM_ID_8: ${{ secrets.PLANLY_TEAM_ID_8 }}
          PLANLY_API_KEY_9: ${{ secrets.PLANLY_API_KEY_9 }}
          PLANLY_TEAM_ID_9: ${{ secrets.PLANLY_TEAM_ID_9 }}
          PLANLY_API_KEY_10: ${{ secrets.PLANLY_API_KEY_10 }}
          PLANLY_TEAM_ID_10: ${{ secrets.PLANLY_TEAM_ID_10 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IN_LIVE: ${{ inputs.live || 'false' }}
          IN_EVENT: ${{ github.event_name }}
        run: |
          args=(--all --publish-only)
          if [ "$IN_EVENT" = "workflow_dispatch" ]; then
            if [ "$IN_LIVE" = "true" ]; then args+=(--live); else args+=(--dry-run); fi
          else
            args+=(--live)
          fi
          echo "Running publish coordinator: run_factory ${args[*]}"
          python tools/run_factory.py "${args[@]}"

      - name: Upload all finished videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: |
            factories/*/output/**/video.mp4
            factories/*/output/**/meta.json
            factories/*/output/**/credits.txt
            factories/*/output/**/creditos.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Commit the status back
        if: always()
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATUS.md status.json 2>/dev/null || true
          git diff --cached --quiet && { echo 'status unchanged'; exit 0; }
          git commit -m 'status: run ${{ github.run_number }}'
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo 'push skipped race'

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state.json
            factories/us/state.json
            factories/mx/state.json
          key: hub-state-${{ github.run_id }}
